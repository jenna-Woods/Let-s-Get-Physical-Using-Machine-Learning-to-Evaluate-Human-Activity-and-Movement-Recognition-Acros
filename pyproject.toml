[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "har-project"
version = "0.1.0"
description = "Leakage-safe UCI HAR classifier and feature-selection experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "matplotlib>=3.8,<4", "joblib>=1.3,<2", "threadpoolctl>=3.5,<4"]

[project.scripts]
har = "har.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
